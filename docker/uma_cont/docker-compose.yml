# docker-compose.yml — UMA Lite profile (uma_lite)
#
# Skeleton for deploying an application that uses UMA with the fully embedded
# backend: SQLite for the memory store and LanceDB for vector storage.
# No external database services are required.
#
# Usage:
#   docker compose up -d
#
# Prerequisites:
#   - Configure your LLM and embedding provider in uma_lite.yaml before building.

services:

  # ── Your application ──────────────────────────────────────────────────────
  # Replace image/build with your own. UMA must be installed inside the image.
  app:
    image: your-app-image:latest          # or use build: { context: . }
    environment:
      - UMA_PROFILE=lite                  # tells UMA to load uma_lite.yaml
    volumes:
      # Single volume covers both embedded backends:
      #   SQLite memory store  → .uma/db/
      #   LanceDB vector index → .uma/vectors/
      # Adjust the container path if your app uses a different WORKDIR.
      - uma_data:/app/.uma

volumes:
  uma_data:  # UMA SQLite + LanceDB persistent storage
