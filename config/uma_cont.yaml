profile: cont

storage:
  db_root: ".uma/db"
  db_root_base: "cwd"
  sql_backend: "sqlite"
  vector_backend: "uma.adapters.vector.qdrant:QdrantIndex"
  vector_config:
    # `http://qdrant:6333` is for UMA running inside the Docker Compose network.
    # If UMA runs on the host while Qdrant runs in Docker, override this to
    # `http://localhost:6333`.
    url: "http://qdrant:6333"
    collection: "uma_vectors"
  graph_backend: "disabled"
  graph_config:
    enabled: false

working_memory:
  max_tokens: 4096
  warning_ratio: 0.7
  hard_limit_ratio: 0.95
  chunk_size: 20
  keep_recent_messages: 4
  keep_recent_token_fraction: 0.1

embedding:
  provider: "ollama"
  model: "nomic-embed-text"
  dimension: 1536
  config:
    host: "http://localhost:11434"
    batch_size: 32
    timeout: 20.0

llms:
  agent:
    provider: "ollama"
    model: "llama3"
    config:
      host: "http://localhost:11434"
      timeout: 20.0
  uma:
    provider: "ollama"
    model: "llama3"
    config:
      host: "http://localhost:11434"
      timeout: 20.0

retrieval:
  max_episodes: 3
  max_facts: 5
  max_skills: 3
  max_graph_items: 3
  max_evidence_chunks: 10
  strict: true
  debug_scores: false
  hybrid:
    enabled: true
    top_k_dense: 0
    top_k_sparse: 0
    fusion_strategy: rrf
  context:
    max_working_messages: 6
    max_episodic: 2
    max_semantic: 4
    max_chunks: 2
    snippet_max_chars: 600
    snippet_refiner_enabled: true
    snippet_refiner_top_k: 6
    max_procedural: 2
    max_graph: 2
    include_working_memory: true
    include_episodic: true
    include_graph: true
    include_procedural: true
  rlm:
    test_mode: true
    max_steps: 2
    max_actions_per_step: 1
    max_items_per_type: 30
    timeout_s: 45.0
    max_env_calls: 8
    predicate_weights:
      LIKES: 1.0
      PREFERS: 0.8

semantic:
  salience_threshold: 0.45

consolidation:
  enabled: true
  cluster_similarity: 0.75
  max_episodes_per_cycle: 200
  prune_min_fact_salience: 0.2

features:
  load:
    - name: procedural
      enabled: true
      provider: "uma.memory.procedural.feature:ProceduralFeature"
      config:
        max_k: 50
    - name: consolidation
      enabled: true
      provider: "uma.memory.consolidation.feature:ConsolidationFeature"
      config:
        cluster_similarity: 0.75
        max_episodes_per_cycle: 200
  policy:
    on_attach_error: "log_and_skip"
    allow_method_override: false

pipeline:
  defer_post_turn: false
  post_turn_queue_max: 200
