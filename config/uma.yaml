# ================================================================
# UMA Unified Configuration
# ================================================================

# ------------------------------
# DB ROOT (all SQL stores live under this path)
# ------------------------------
storage:
  db_root: "./data/"         # UMA will create SQL DBs inside here
  # db_root_base: "auto"   # auto | cwd | config (controls relative path resolution)
  sql_backend: "sqlite"    # or plugin spec "db.postgres_adapter:PostgresAdapter"
  vector_backend: "vector.qdrant_adapter:QdrantIndex"
  graph_backend: "graph.neo4j_adapter:Neo4jAdapter"  # plugin spec or "disabled"
  # Vector backend configuration (adapter-specific)
  vector_config:
    # Qdrant (custom adapter)
    url: "http://192.168.178.101:6333"
    collection: "uma-rlm"
    #api_key: ""
    prefer_grpc: false
    timeout_s: 10.0
    distance: "cosine"
    on_disk_payload: false
    bm25_enabled: false

  graph_config:
    # Neo4j (custom adapter)
    #uri: "neo4j://127.0.0.1:7687" 
    uri: "neo4j://192.168.178.101:7687" 
    user: "neo4j"
    password: "umaisthebest"
    max_pool_size: 50
    # Note: The Community Edition of Neo4j supports running a single database at a time. 
    # Additionally, the Community version does not include the capability to assign roles and permissions to users.
    database: neo4j
# ------------------------------
# Working Memory
# ------------------------------
working_memory:
  max_tokens: 4096
  warning_ratio: 0.7
  hard_limit_ratio: 0.95
  chunk_size: 20
  # How many recent messages to preserve during compaction (minimum)
  keep_recent_messages: 4
  # Token fraction of `max_tokens` that recent messages should cover before
  # summarizing older messages (hybrid token+message rule)
  keep_recent_token_fraction: 0.1

# ------------------------------
# Embeddings
# ------------------------------
embedding:
  provider: "ollama"
  model: "nomic-embed-text:latest"
  #model: "all-minilm"
  dimension: 768 # all-minilm 384 768
  config:
   host: "http://192.168.178.101:11434"
    #host: "http://localhost:11434"

# ------------------------------
# LLMs (Agent + UMA internal)
# ------------------------------
# Key Details on Qwen2.5-3B Context:
# Context Length: 32,768 tokens.
# Generation Length: Capable of generating up to 8,192 tokens.
# Performance: Optimized for long text, coding, and structured data.
#------------------
# Key Details on gpt-oss Context:
# Context Length: 128k tokens.
# Generation Length: Capable of generating up to 8,192 tokens.
llms:
  agent:
    provider: "ollama"
    model: "qwen2.5:3b"
    config:
      timeout: 60
      host: "http://192.168.178.101:11434"
      #host: "http://localhost:11434"
  uma:
    provider: "ollama"
    model: "qwen2.5:3b"
    config:
      timeout: 60
      host: "http://192.168.178.101:11434"
      #host: "http://localhost:11434"
# ------------------------------
# Retrieval
# ------------------------------
retrieval:
  max_episodes: 3
  max_facts: 5
  max_skills: 3
  max_graph_items: 3
  max_evidence_chunks: 10
  strict: true
  debug_scores: false

  # Hybrid retrieval (dense + lexical), provider-agnostic.
  hybrid:
    enabled: true
    top_k_dense: 0       # 0 => use the call-site k
    top_k_sparse: 0      # disables lexical retrieval
    fusion_strategy: rrf # rrf | overlap_boost

  context:
    max_working_messages: 6
    max_episodic: 2
    max_semantic: 4
    max_chunks: 2
    snippet_max_chars: 600
    snippet_refiner_enabled: true
    snippet_refiner_top_k: 6
    max_procedural: 2
    max_graph: 2
    include_working_memory: true
    include_episodic: true
    include_graph: true
    include_procedural: true


  # Recursive Language Model (RLM) retrieval
  rlm:
    test_mode: true

    # Maximum recursive steps the controller can take
    max_steps: 2

    # Maximum retrieval actions per step
    max_actions_per_step: 1

    # Hard cap per memory type (safety)
    max_items_per_type: 30

    # Total wall-clock timeout for RLM retrieval
    timeout_s: 45.0

    # Max environment calls per request
    max_env_calls: 8

    # Deterministic coverage heuristics (optional)
    # semantic_first: true
    # clusters_first: true
    # salience_threshold: 0.6
    # min_semantic_facts: 4
    # min_high_salience_facts: 2
    # min_cluster_summaries: 1
    # cluster_k: 3
    # graph_predicate_limit: 2
    predicate_weights:
      LIKES: 1.0
      PREFERS: 0.8

# ------------------------------
# Semantic tuning
# ------------------------------
semantic:
  salience_threshold: 0.45
  doc_min_fact_words: 10
  doc_summary_enabled: true
  doc_summary_max_facts: 5

# ------------------------------
# Consolidation Engine
# ------------------------------
consolidation:
  enabled: true
  cluster_similarity: 0.75
  max_episodes_per_cycle: 200
  prune_min_fact_salience: 0.2

# ------------------------------
# Feature Flags
# ------------------------------
features:
  load:
    - name: procedural
      enabled: true
      provider: "uma.features.procedural.feature:ProceduralFeature"
      config:
        max_k: 50
    - name: consolidation
      enabled: true
      provider: "uma.features.consolidation.feature:ConsolidationFeature"
      config:
        cluster_similarity: 0.75
        max_episodes_per_cycle: 200
  policy:
    on_attach_error: "log_and_skip"
    allow_method_override: false

# ------------------------------
# Pipeline (performance)
# ------------------------------
pipeline:
  # If true, defer post-turn maintenance work to a background queue.
  # This reduces response latency but makes episodic/graph updates async.
  defer_post_turn: false
  # Hard cap for deferred post-turn tasks.
  post_turn_queue_max: 200
