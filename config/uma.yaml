# Default embedded profile. No external vector database is required.
profile: lite

storage:
  db_root: ".uma/db"
  db_root_base: "cwd"
  sql_backend: "sqlite"
  # LanceDB stores vectors locally under .uma/vectors.
  vector_backend: "uma.adapters.vector.lancedb:LanceDBIndex"
  vector_config:
    path: ".uma/vectors"
  # Graph is optional and disabled in the public profiles.
  graph_backend: "disabled"
  graph_config:
    enabled: false

working_memory:
  max_tokens: 4096
  warning_ratio: 0.7
  hard_limit_ratio: 0.95
  chunk_size: 20
  keep_recent_messages: 4
  keep_recent_token_fraction: 0.1

embedding:
  provider: "ollama"
  model: "all-minilm"
  dimension: 384
  config:
    host: "http://localhost:11434"
    batch_size: 32
    timeout: 20.0

llms:
  # UMA uses this LLM internally for memory extraction and summarization.
  uma:
    provider: "ollama"
    model: "phi4-mini:latest"
    config:
      host: "http://localhost:11434"
      timeout: 20.0

retrieval:
  max_episodes: 3
  max_facts: 5
  max_skills: 3
  max_graph_items: 3
  max_evidence_chunks: 10
  strict: true
  debug_scores: false
  context:
    max_working_messages: 6
    max_episodic: 2
    max_semantic: 4
    max_chunks: 2
    snippet_max_chars: 600
    snippet_refiner_enabled: true
    snippet_refiner_top_k: 6
    max_procedural: 2
    include_working_memory: true
    include_episodic: true
    include_graph: false
    include_procedural: true

semantic:
  salience_threshold: 0.45

features:
  load:
    - name: procedural
      enabled: true
      provider: "uma.memory.procedural.feature:ProceduralFeature"
      config:
        max_k: 50
  policy:
    on_attach_error: "log_and_skip"
    allow_method_override: false

pipeline:
  defer_post_turn: false
  post_turn_queue_max: 200
