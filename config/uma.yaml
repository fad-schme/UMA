# Default embedded profile. No external vector database is required.
profile: lite

storage:
  db_root: ".uma/db"
  db_root_base: "cwd"
  sql_backend: "sqlite"
  # LanceDB stores vectors locally under .uma/vectors.
  vector_backend: "uma.adapters.vector.lancedb:LanceDBIndex"
  vector_config:
    path: ".uma/vectors"
  # Graph is optional and disabled in the public profiles.
  graph_backend: "disabled"
  graph_config:
    enabled: false

working_memory:
  max_tokens: 4096
  warning_ratio: 0.7
  hard_limit_ratio: 0.95
  chunk_size: 20
  keep_recent_messages: 4
  keep_recent_token_fraction: 0.1

embedding:
  provider: "ollama"
  model: "nomic-embed-text"
  dimension: 768
  config:
    host: "http://localhost:11434"
    batch_size: 32
    timeout: 20.0
    max_input_chars: 512

llms:
  # UMA uses this LLM internally for memory extraction and summarization.
  uma:
    provider: "ollama"
    model: "qwen2.5:3b"
    config:
      host: "http://localhost:11434"
      timeout: 60.0

retrieval:
  max_evidence_chunks: 10
  debug_scores: false

semantic:
  salience_threshold: 0.45
