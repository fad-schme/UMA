# ================================================================
# UMA Unified Configuration
# ================================================================

# ------------------------------
# DB ROOT (all SQL stores live under this path)
# ------------------------------
storage:
  db_root: "./data/"         # UMA will create SQL DBs inside here
  # db_root_base: "auto"   # auto | cwd | config (controls relative path resolution)
  sql_backend: "sqlite"    # future: postgres, mysql, etc.
  vector_backend: "faiss"  # or "pinecone", "weaviate", "inmemory"
  graph_backend: "neo4j"  # "neo4j", "memgraph", "disabled"
  # Vector backend configuration (required for pinecone/weaviate) umaIstheBest70
  vector_config:
    # Pinecone
    index_name: "uma-memory"
    # Weaviate
    url: "https://your-weaviate-host"
    api_key: "YOUR_WEAVIATE_API_KEY"
    class_name: "UMAMemory"
    

graph:
  uri: "neo4j://localhost:7687"
  user: "neo4j"
  password: "umaIstheBest70"
  max_pool_size: 50
  database: uma4j-2
# ------------------------------
# Working Memory
# ------------------------------
working_memory:
  max_tokens: 4096
  warning_ratio: 0.7
  hard_limit_ratio: 0.95
  chunk_size: 20
  # How many recent messages to preserve during compaction (minimum)
  keep_recent_messages: 4
  # Token fraction of `max_tokens` that recent messages should cover before
  # summarizing older messages (hybrid token+message rule)
  keep_recent_token_fraction: 0.1

# ------------------------------
# Embeddings
# ------------------------------
embedding:
  provider: "ollama"
  model: "all-minilm"
  dimension: 384

# ------------------------------
# LLM (UMA internal)
# ------------------------------
llm:
  provider: "ollama"
  model: "qwen2.5:3b"
  config:
    timeout: 60

# ------------------------------
# Retrieval
# ------------------------------
retrieval:
  max_episodes: 3
  max_facts: 5
  max_skills: 3
  max_graph_items: 3

  context:
    max_working_messages: 2
    max_episodic: 2
    max_semantic: 4
    max_procedural: 2
    max_graph: 2
    prefer_semantic_only: true

  # Recursive Language Model (RLM) retrieval
  rlm:
    enabled: true
    test_mode: true
    extract_snippets: true
    max_eval_rounds: 2
    max_eval_chunks: 12
    max_snippet_chars: 320
    deterministic_only: false

    # Maximum recursive steps the controller can take
    max_steps: 2

    # Maximum retrieval actions per step
    max_actions_per_step: 1

    # Hard cap per memory type (safety)
    max_items_per_type: 30

    # LLM budget for controller decisions
    llm_max_tokens: 120

    # Total wall-clock timeout for RLM retrieval
    timeout_s: 45.0

    # Max environment calls per request
    max_env_calls: 8

    # Max characters per returned text field in RLM results
    max_return_chars: 800

    # Deterministic coverage heuristics (optional)
    # semantic_first: true
    # clusters_first: true
    # salience_threshold: 0.6
    # min_semantic_facts: 4
    # min_high_salience_facts: 2
    # min_cluster_summaries: 1
    # cluster_k: 3
    # graph_predicate_limit: 2
    predicate_weights:
      LIKES: 1.0
      PREFERS: 0.8

# ------------------------------
# Consolidation Engine
# ------------------------------
consolidation:
  enabled: true
  cluster_similarity: 0.75
  max_episodes_per_cycle: 200
  prune_min_fact_salience: 0.2

# ------------------------------
# Feature Flags
# ------------------------------
features:
  load:
    - name: procedural
      enabled: true
      provider: "uma.features.procedural.feature:ProceduralFeature"
      config:
        max_k: 50
    - name: consolidation
      enabled: true
      provider: "uma.features.consolidation.feature:ConsolidationFeature"
      config:
        cluster_similarity: 0.75
        max_episodes_per_cycle: 200
  policy:
    on_attach_error: "log_and_skip"
    allow_method_override: false
