[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uma"
description = "UMA: Unified Memory Architecture for AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
urls = {Homepage = "https://uma.memory-engineering.com", Repository = "https://github.com/fad-schme/UMA"}
authors = [
  { name = "a.Diaz-Schmeier", email = "ad-schme@memory-engineering.com" },
]
dynamic = ["version"]
dependencies = [
  "pyyaml",
  "numpy",
  "aiohttp",
  "charset-normalizer",
  "pydantic>=2",
  "lancedb>=0.25.3",
]

[project.optional-dependencies]
llm = ["anthropic"]
openai = ["openai>=1.0.0"]
dev = ["pytest", "matplotlib", "PyPDF2", "pytest-asyncio", "bandit","ruff", "pip-audit", "beautifulsoup4", "markdown", "pandas"]
ollama = ["ollama"]

[tool.setuptools.dynamic]
version = {attr = "uma.version.__version__"}

[tool.setuptools.packages.find]
namespaces = true
include = ["uma*"]
exclude = [".venv*", ".pytest_cache*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "--basetemp=.pytest_tmp"
