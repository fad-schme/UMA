[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uma-mem"
description = "UMA: modular memory and context manager SDK for AI agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [
    { name = "A Diaz-Schmeier", email = "ad-schme@aibestlabs.com" },
]
keywords = ["memory", "context", "rag", "ai", "agents", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pyyaml",
    "numpy",
    "aiohttp",
    "charset-normalizer",
    "pydantic>=2",
    "lancedb>=0.25.3",
]

# Version read dynamically from uma/version.py so it stays in sync with the
# `__version__` attribute the runtime imports.
dynamic = ["version"]

[project.urls]
Homepage      = "https://uma.ai-mem-engineering.com"
Documentation = "https://uma.ai-mem-engineering.com/docs.html"
# README links resolve against this repo; keep the two in sync.
Source        = "https://github.com/fad-schme/UMA"
Changelog     = "https://github.com/fad-schme/UMA/blob/main/CHANGELOG.md"

[project.scripts]
uma = "uma.cli:main"
uma-mcp = "uma.mcp.server:main"

[project.optional-dependencies]

# LLM providers
llm      = ["anthropic"]
openai   = ["openai>=1.0.0"]
ollama   = ["openai>=1.0.0"]
e2e      = ["openai>=1.0.0"]

# MCP 2.x removed the ``mcp.server.fastmcp`` API used by UMA's stdio server.
mcp      = ["mcp[cli]>=1.0.0,<2.0.0"]

# Storage backends
vector   = ["faiss-cpu"]
graph    = ["neo4j"]

# Security: enable the google-re2 backend for ReDoS-proof injection scanning.
# See uma/common/_regex_backend.py.
security = ["google-re2>=1.1"]

# Document parsers used by the ingest pipeline.
parsers  = ["PyPDF2>=3.9.0", "beautifulsoup4", "markdown", "pandas"]

# Development / test tools. `pip install -e '.[dev]'` is what
# requirements.txt resolves to.
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-timeout",
    "bandit[toml]",
    "pip-audit",
    "ruff",
    "mypy",
    "types-PyYAML",
    "matplotlib",
    "setuptools>=83.0.0",
    "uma-mem[parsers]",
    "uma-mem[mcp]",
    "openai>=1.0.0",
]

# -----------------------------------------------------------------------------
# Setuptools-specific configuration
# -----------------------------------------------------------------------------

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "uma.version.__version__" }

[tool.setuptools.packages.find]
include = ["uma", "uma.*"]
namespaces = true

[tool.setuptools.package-data]
"uma.adapters.scanner" = ["injection_patterns*.yaml", "sqli_patterns.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "--basetemp=.pytest_tmp"
# No test in this suite legitimately runs near a minute (the slowest is ~2s).
# The cap exists so a deadlock fails the run instead of wedging it: threads
# blocked in `asyncio.to_thread` are non-daemon, so the interpreter joins them
# at shutdown and a stuck one hangs pytest forever with no output.
# "thread" method is required on Windows (signal-based timeouts are POSIX-only).
timeout = 60
timeout_method = "thread"

[tool.bandit]
skips = ["B608", "B105"]

[tool.ruff.lint]
select = ["E", "F", "W", "UP006"]
ignore = ["E402", "E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
