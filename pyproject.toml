# =============================================================================
# UMA — Universal Memory Architecture
#
# Single source of truth for packaging, metadata, and optional dependencies.
# Historically split across setup.py + pyproject.toml with drift; consolidated
# into this file. See CHANGELOG.md `[unreleased]` for the migration note.
# =============================================================================

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

# -----------------------------------------------------------------------------
# Project metadata (PEP 621)
# -----------------------------------------------------------------------------

[project]
name = "uma"
description = "UMA: modular memory and context manager for AI agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
authors = [
    { name = "a.Diaz-Schmeier", email = "ad-schme@ai-mem-engineering.com" },
]
keywords = ["memory", "context", "rag", "ai", "agents", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime dependencies (was `install_requires` in setup.py).
# Every entry here is imported unconditionally by the base install.
dependencies = [
    "pyyaml",
    "numpy",
    "aiohttp",
    "charset-normalizer",
    "pydantic>=2",
    "lancedb>=0.25.3",
]

# Version read dynamically from uma/version.py so it stays in sync with the
# `__version__` attribute the runtime imports.
dynamic = ["version"]

[project.urls]
Homepage      = "https://uma.ai-mem-engineering.com"
Documentation = "https://uma.ai-mem-engineering.com/docs.html"

# -----------------------------------------------------------------------------
# Optional dependencies — install with `pip install -e '.[<name>]'`
#
# Every extra lives here. Do not add a second install_requires block anywhere
# else in the repo; the old setup.py/pyproject.toml split was the source of
# finding #24 drift.
# -----------------------------------------------------------------------------

[project.optional-dependencies]

# LLM providers
llm      = ["anthropic"]
openai   = ["openai>=1.0.0"]
ollama   = ["ollama"]
e2e      = ["openai>=1.0.0"]

# Storage backends
vector   = ["faiss-cpu"]
graph    = ["neo4j"]

# Security: enable the google-re2 backend for ReDoS-proof injection scanning.
# See uma/common/_regex_backend.py.
security = ["google-re2>=1.1"]

# Document parsers used by the ingest pipeline.
parsers  = ["PyPDF2", "beautifulsoup4", "markdown", "pandas"]

# Development / test tools. `pip install -e '.[dev]'` is what
# requirements.txt resolves to.
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "bandit[toml]",
    "pip-audit",
    "ruff",
    "matplotlib",
    "PyPDF2",
]

# -----------------------------------------------------------------------------
# Setuptools-specific configuration
# -----------------------------------------------------------------------------

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "uma.version.__version__" }

[tool.setuptools.packages.find]
include = ["uma", "uma.*"]
namespaces = true

[tool.setuptools.package-data]
"uma.common" = ["injection_patterns*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "--basetemp=.pytest_tmp"

[tool.bandit]
skips = ["B608", "B105"]

[tool.ruff.lint]
select = ["E", "F", "W", "UP006"]
ignore = ["E402", "E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
