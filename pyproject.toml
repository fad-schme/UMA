[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uma"
description = "UMA: modular memory and context manager for AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
  { name = "a.Diaz-Schmeier", email = "ad-schme@memory-engineering.com" },
]
dynamic = ["version"]
dependencies = [
  "pyyaml",
  "numpy",
  "aiohttp",
  "charset-normalizer",
  "pydantic>=2",
  "openai>=1.0.0",
]

[project.optional-dependencies]
vector = ["faiss-cpu", "weaviate-client", "pinecone-client", "qdrant-client", "fastembed"]
graph = ["neo4j"]
postgres = ["psycopg2-binary>=2.9"]
dev = ["pytest", "matplotlib", "PyPDF2", "pytest-asyncio"]
ollama = ["ollama"]
parsers = ["PyPDF2", "beautifulsoup4", "markdown", "pandas"]

[tool.setuptools.dynamic]
version = {attr = "uma.version.__version__"}

[tool.setuptools.packages.find]
include = ["uma*"]
exclude = ["uma.extensions*", "tests*", "examples*", "scripts*", "config*", ".venv*", ".pytest_cache*"]
