name: Publish

# Build once, then publish the same artifacts to TestPyPI and/or PyPI.
#
# Triggers:
#   * push of a `v*` tag        -> build, TestPyPI, then PyPI. The full release
#     path: TestPyPI is the rehearsal and PyPI only runs if it succeeded.
#   * dispatch, target testpypi -> build, TestPyPI only (the default).
#   * dispatch, target pypi     -> build, PyPI only, without going through
#     TestPyPI. For re-uploading a release whose PyPI step failed after the
#     rehearsal already passed, or for publishing without pushing a tag.
#
# Each index is reachable on its own, so a failure on one never blocks the
# other. Both upload jobs sit behind their own environment; keep a required
# reviewer on `pypi` — a dispatch to PyPI has no tag/version guard to fall
# back on (see the build job), and a version number can never be reused.
#
# Uploads use PyPI Trusted Publishing (OIDC), so no API tokens are stored.
# Configure the publishers once per index for project `uma-mem`, repository
# `UMA`, workflow `publish.yml`, environments `pypi` and `testpypi`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Index to publish the build to"
        type: choice
        default: testpypi
        options:
          - testpypi
          - pypi

# Never run two publishes for the same ref concurrently, and never cancel one
# mid-upload: a partially uploaded release cannot be replaced on PyPI.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  # Single build for both indexes. Publishing the exact artifacts that were
  # verified here keeps TestPyPI and PyPI bit-identical.
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: python -m pip install build twine packaging

      - name: Build source distribution and wheel
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check --strict dist/*

      # A tag that disagrees with uma/version.py would publish a release under
      # the wrong number, which PyPI will not let us take back. Comparison is on
      # PEP 440 normalized forms, so a tag stays valid if the version ever grows
      # a pre-release suffix again (`v0.3.0-beta` == packaged `0.3.0b0`).
      #
      # A dispatch has no tag to check against, so on that path the only
      # protections are the environment's reviewer and PyPI rejecting a version
      # it already holds. Bump uma/version.py before dispatching to PyPI.
      - name: Verify tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import sys

          from packaging.utils import parse_sdist_filename
          from packaging.version import InvalidVersion, Version

          sdists = sorted(pathlib.Path("dist").glob("*.tar.gz"))
          if len(sdists) != 1:
              sys.exit(f"expected exactly one sdist in dist/, found {sdists}")

          _, packaged = parse_sdist_filename(sdists[0].name)
          raw_tag = os.environ["GIT_TAG"].removeprefix("v")

          try:
              tagged = Version(raw_tag)
          except InvalidVersion:
              sys.exit(f"tag {raw_tag!r} is not a valid PEP 440 version")

          if tagged != packaged:
              sys.exit(f"tag {tagged} does not match packaged version {packaged}")

          print(f"tag and package agree on version {packaged}")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # TestPyPI is the rehearsal: it proves the metadata and Trusted Publishing
  # configuration work before the release becomes permanent on PyPI. Skipped
  # when a dispatch targets PyPI directly.
  testpypi:
    name: Publish to TestPyPI
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: testpypi
      url: https://test.pypi.org/project/uma-mem/

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Upload to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Re-running a dispatch build for an unchanged version would otherwise
          # fail on an already-present file. Only tolerated on the rehearsal index.
          skip-existing: true

  # PyPI is irreversible: a version number can never be reused. The `pypi`
  # environment should carry a required reviewer so the upload is deliberate.
  #
  # `needs` keeps the tag path ordered (rehearse, then release) without making
  # TestPyPI a precondition for a direct dispatch. The leading `!cancelled()`
  # is what allows this job to be reached at all when `testpypi` is skipped —
  # a plain `if` would inherit the default "skip when a dependency skipped".
  # A *failed* rehearsal still stops the release.
  pypi:
    name: Publish to PyPI
    needs: [build, testpypi]
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && (needs.testpypi.result == 'success' || needs.testpypi.result == 'skipped')
      && (startsWith(github.ref, 'refs/tags/v') || inputs.target == 'pypi')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: pypi
      url: https://pypi.org/project/uma-mem/

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
